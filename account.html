<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Sign in to your @TENACIOUS customer account and view your orders.">
  <title>My Account | @TENACIOUS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{color-scheme:dark;--black:#080808;--charcoal:#111;--gold:#c5a059;--white:#f5f3ef;--muted:#a9a59e;--line:rgba(245,243,239,.13);--danger:#ffaaa0;--serif:"Cinzel",Georgia,serif}
    *{box-sizing:border-box}
    body{margin:0;background:var(--black);color:var(--white);font:400 14px/1.65 "Montserrat",sans-serif;min-height:100vh}
    a{color:inherit;text-decoration:none}
    button,input{font:inherit}
    button{cursor:pointer}
    .topbar{height:72px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 clamp(20px,5vw,72px);background:#090909}
    .brand{font-size:13px;font-weight:700;letter-spacing:.25em}.brand span{color:var(--gold)}
    .toplinks{display:flex;align-items:center;gap:24px;color:var(--muted);font-size:11px;letter-spacing:.12em;text-transform:uppercase}
    .toplinks a:hover{color:var(--gold)}
    main{width:min(1120px,calc(100% - 36px));margin:0 auto;padding:68px 0 90px}
    .eyebrow{color:var(--gold);font-size:10px;font-weight:600;letter-spacing:.24em;text-transform:uppercase}
    h1,h2,h3{font-family:var(--serif);font-weight:400;line-height:1.25}
    h1{font-size:clamp(34px,6vw,54px);margin:10px 0 8px}
    h2{font-size:clamp(23px,3vw,30px);margin:0 0 20px}
    h3{font-size:19px;margin:0}
    .intro,.muted{color:var(--muted)}
    .auth-card{width:min(480px,100%);margin:40px auto 0;padding:clamp(24px,6vw,42px);border:1px solid var(--line);background:linear-gradient(145deg,#141414,#0d0d0d)}
    .auth-card h2{margin-bottom:8px}
    .auth-card p{color:var(--muted);margin:0 0 24px}
    label{display:block;color:#ddd8ce;font-size:11px;font-weight:600;letter-spacing:.08em;margin:17px 0 7px}
    input{width:100%;min-height:48px;padding:12px 14px;border:1px solid #393630;background:#090909;color:var(--white);outline:none}
    input:focus{border-color:var(--gold)}
    input::placeholder{color:#77736d}
    .button{min-height:48px;border:1px solid var(--gold);padding:12px 18px;background:var(--gold);color:#111;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
    .button:hover{background:#d3b779}
    .button:disabled{opacity:.55;cursor:wait}
    .auth-card .button{width:100%;margin-top:22px}
    .text-button{border:0;background:none;color:var(--gold);padding:12px 0;font-size:11px;text-decoration:underline;text-underline-offset:4px}
    .status{min-height:24px;margin-top:16px;color:var(--muted);font-size:12px}
    .status.error{color:var(--danger)}.status.success{color:#d8c28e}
    [hidden]{display:none!important}
    .dashboard[hidden],.auth-card[hidden]{display:none}
    .dashboard-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:32px}
    .dashboard-head .muted{margin:4px 0 0}
    .logout{background:none;border:1px solid var(--line);color:var(--white);padding:10px 16px;font-size:10px;letter-spacing:.1em;text-transform:uppercase}
    .logout:hover{border-color:var(--gold);color:var(--gold)}
    .account-nav{display:flex;gap:6px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:26px}
    .account-nav button{white-space:nowrap;border:0;border-bottom:2px solid transparent;background:none;color:var(--muted);padding:13px 15px;font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase}
    .account-nav button[aria-selected="true"]{border-color:var(--gold);color:var(--gold)}
    .panel{border:1px solid var(--line);background:var(--charcoal);padding:clamp(20px,4vw,32px)}
    .metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:22px 0}
    .metric{padding:18px;border:1px solid var(--line);background:#0c0c0c;min-width:0}
    .metric span{display:block;color:var(--muted);font-size:9px;letter-spacing:.12em;text-transform:uppercase}
    .metric strong{display:block;margin-top:7px;color:var(--white);font-size:17px;font-weight:500;overflow-wrap:anywhere}
    .info-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 30px}
    .info-item span{display:block;color:var(--muted);font-size:10px;letter-spacing:.1em;text-transform:uppercase}
    .info-item strong{display:block;margin-top:4px;font-weight:500;overflow-wrap:anywhere}
    .order-list{display:grid;gap:14px}
    .order-card{border:1px solid var(--line);padding:20px;background:#0d0d0d}
    .order-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px}
    .order-top .order-ref{font-weight:600;overflow-wrap:anywhere}
    .pill{display:inline-block;border:1px solid rgba(197,160,89,.5);color:#e2c990;padding:4px 9px;font-size:9px;letter-spacing:.08em;text-transform:uppercase}
    .order-fields{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
    .order-fields span{display:block;color:var(--muted);font-size:9px;letter-spacing:.08em;text-transform:uppercase}
    .order-fields strong{display:block;margin-top:3px;font-size:12px;font-weight:500;overflow-wrap:anywhere}
    .shipment{margin-top:17px;padding-top:14px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px 20px;color:#ddd8ce;font-size:11px}
    .shipment a{color:var(--gold);text-decoration:underline;text-underline-offset:3px}
    .empty{padding:36px 20px;text-align:center;border:1px dashed #393630;color:var(--muted)}
    .empty strong{display:block;color:var(--white);font-weight:500;margin-bottom:5px}
    footer{border-top:1px solid var(--line);padding:24px;text-align:center;color:#777;font-size:10px;letter-spacing:.12em}
    @media(max-width:720px){main{padding-top:42px}.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.order-fields{grid-template-columns:repeat(2,minmax(0,1fr))}.toplinks{gap:14px;font-size:9px}}
    @media(max-width:460px){.topbar{height:62px;padding:0 16px}.toplinks a:not(:last-child){display:none}.dashboard-head{align-items:flex-start}.logout{padding:9px 10px}.info-grid{grid-template-columns:1fr}.order-top{flex-direction:column}.account-nav button{padding-inline:11px}}
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html"><span>@</span>TENACIOUS</a>
    <nav class="toplinks" aria-label="Main navigation"><a href="index.html">Store</a><a href="tenacious-circle.html">Tenacious Circle</a></nav>
  </header>
  <main>
    <p class="eyebrow">Private customer access</p>
    <h1>My Account</h1>
    <p class="intro">Your orders and account details, in one place.</p>

    <section class="auth-card" id="auth-card" aria-labelledby="signin-title">
      <h2 id="signin-title">Welcome back</h2>
      <p>Enter your email and we’ll send you a six-digit verification code.</p>
      <form id="request-form">
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" autocomplete="email" required maxlength="254" placeholder="you@example.com">
        <button class="button" id="send-code" type="submit">Send verification code</button>
      </form>
      <form id="verify-form" hidden>
        <label for="code">Six-digit verification code</label>
        <input id="code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required placeholder="000000" aria-describedby="code-hint">
        <p id="code-hint" class="muted" style="font-size:11px;margin:6px 0 0">Check your inbox for the code.</p>
        <button class="button" id="verify-code" type="submit">Verify and sign in</button>
        <button class="text-button" id="resend-code" type="button">Resend code</button>
      </form>
      <p class="status" id="auth-status" role="status" aria-live="polite"></p>
    </section>

    <section class="dashboard" id="dashboard" hidden aria-label="Customer account">
      <div class="dashboard-head">
        <div><p class="eyebrow">Your account</p><h2 id="welcome-name">Account overview</h2><p class="muted" id="welcome-email"></p></div>
        <button class="logout" id="logout" type="button">Sign out</button>
      </div>
      <nav class="account-nav" aria-label="Account sections" role="tablist">
        <button type="button" role="tab" data-view="overview" aria-selected="true">Overview</button>
        <button type="button" role="tab" data-view="orders" aria-selected="false">My orders</button>
        <button type="button" role="tab" data-view="tracking" aria-selected="false">Shipment tracking</button>
        <button type="button" role="tab" data-view="information" aria-selected="false">Account information</button>
      </nav>
      <div id="account-content" aria-live="polite"></div>
      <p class="status" id="dashboard-status" role="status" aria-live="polite"></p>
    </section>
  </main>
  <footer>@TENACIOUS · RESILIENT BY CHOICE</footer>
  <script src="customer-account.js" defer></script>
</body>
</html>
