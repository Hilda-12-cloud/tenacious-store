<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Premium Sherpa Blanket | @Tenacious</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #0b0b0b;
      color: #ffffff;
      font-family: Arial, sans-serif;
      line-height: 1.6;
    }

    .product-page {
      max-width: 1100px;
      margin: auto;
      padding: 40px 20px;
    }

    .back-link {
      display: inline-block;
      color: #ffffff;
      text-decoration: none;
      margin-bottom: 35px;
      font-size: 14px;
      opacity: 0.8;
    }

    .back-link:hover {
      opacity: 1;
    }

    .product-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 60px;
      align-items: center;
    }

    /* PRODUCT GALLERY */

    .product-gallery {
      width: 100%;
    }

    .main-product-image {
      width: 100%;
      height: 450px;
      background: #111111;
      border: 1px solid #2d2d2d;
      padding: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .main-product-image img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    /* THUMBNAILS */

    .product-thumbnails {
      display: flex;
      gap: 12px;
      margin-top: 15px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .product-thumbnails img {
      width: 80px;
      height: 80px;
      min-width: 80px;
      min-height: 80px;
      max-width: 80px;
      max-height: 80px;
      object-fit: contain;
      background: #111111;
      border: 1px solid #2d2d2d;
      padding: 3px;
      display: block;
      cursor: pointer;
      flex: 0 0 80px;
    }

    .product-thumbnails img:hover {
      border-color: #ffffff;
    }

    /* PRODUCT INFORMATION */

    .product-info h1 {
      font-size: 42px;
      margin-bottom: 20px;
      letter-spacing: 1px;
    }

    .description {
      color: #cfcfcf;
      margin-bottom: 25px;
      font-size: 16px;
    }

    .price {
      font-size: 28px;
      margin-bottom: 30px;
      font-weight: bold;
    }

    .order-button {
      display: block;
      width: 100%;
      padding: 16px;
      background: #ffffff;
      color: #000000;
      text-align: center;
      font-weight: bold;
      border: none;
      cursor: pointer;
      margin-bottom: 15px;
    }

    .whatsapp-button {
      display: block;
      width: 100%;
      padding: 16px;
      border: 1px solid #ffffff;
      color: #ffffff;
      text-align: center;
      text-decoration: none;
      font-weight: bold;
    }

    .details {
      margin-top: 35px;
      border-top: 1px solid #2d2d2d;
      padding-top: 25px;
    }

    .details h2 {
      font-size: 18px;
      margin-bottom: 15px;
    }

    .details p {
      color: #bdbdbd;
      margin-bottom: 8px;
    }

    /* MOBILE */

    @media (max-width: 768px) {

      .product-container {
        grid-template-columns: 1fr;
        gap: 35px;
      }

      .product-info h1 {
        font-size: 32px;
      }

      .product-page {
        padding: 25px 15px;
      }

      .main-product-image {
        height: 450px;
      }

    }
  </style>
</head>

<body>

  <main class="product-page">

    <a href="index.html#shop" class="back-link">
      ← Back to Shop
    </a>

    <div class="product-container">

      <!-- PRODUCT GALLERY -->

      <div class="product-gallery">

        <!-- MAIN IMAGE -->
        <div class="main-product-image">

          <img
            id="mainProductImage"
            src="embroidered-premium-sherpa-blanket-black-front-6a5eed73c1ced.png"
            alt="Premium Sherpa Blanket">

        </div>


        <!-- 7 THUMBNAILS -->

        <div class="product-thumbnails">

          <!-- THUMBNAIL 1 — ORIGINAL MAIN BLANKET -->
          <img
            src="embroidered-premium-sherpa-blanket-black-front-6a5eed73c1ced.png"
            alt="Premium Sherpa Blanket main view"
            onclick="changeProductImage(this.src)">


          <!-- THUMBNAIL 2 -->
          <img
            src="embroidered-premium-sherpa-blanket-black-front-2-6a5eed73c1c08.png"
            alt="Premium Sherpa Blanket front"
            onclick="changeProductImage(this.src)">


          <!-- THUMBNAIL 3 -->
          <img
            src="embroidered-premium-sherpa-blanket-black-front-2-6a5eed73c1c89.png"
            alt="Premium Sherpa Blanket front view"
            onclick="changeProductImage(this.src)">


          <!-- THUMBNAIL 4 -->
          <img
            src="embroidered-premium-sherpa-blanket-black-product-details-2-6a5eed73c1b96.png"
            alt="Premium Sherpa Blanket details"
            onclick="changeProductImage(this.src)">


          <!-- THUMBNAIL 5 -->
          <img
            src="embroidered-premium-sherpa-blanket-black-product-details-6a5eed73c1afd.png"
            alt="Premium Sherpa Blanket product details"
            onclick="changeProductImage(this.src)">


          <!-- THUMBNAIL 6 -->
          <img
            src="embroidered-premium-sherpa-blanket-black-front-6a5eed73c1a75.png"
            alt="Premium Sherpa Blanket front"
            onclick="changeProductImage(this.src)">


          <!-- THUMBNAIL 7 -->
          <img
            src="embroidered-premium-sherpa-blanket-black-back-6a5eed73c1ac8.png"
            alt="Premium Sherpa Blanket back"
            onclick="changeProductImage(this.src)">

        </div>

      </div>


      <!-- PRODUCT INFORMATION -->

      <div class="product-info">

        <h1>Premium Sherpa Blanket</h1>

        <p class="description">
          Wrap yourself in comfort and the @Tenacious spirit — softness
          designed for those who remain resilient by choice.
        </p>

        <p class="price">$90.00</p>


        <button
          class="order-button"
          onclick="addToCart()">

          Add to Cart

        </button>


        <a href="#" class="whatsapp-button">
          Order via WhatsApp
        </a>


        <div class="details">

          <h2>Product Details</h2>

          <p>• Premium sherpa fabric</p>
          <p>• Ultra-soft & comfortable</p>
          <p>• @Tenacious design</p>

        </div>

      </div>

    </div>

  </main>


  <script>

    function addToCart() {

      const product = {
        name: "Premium Sherpa Blanket",
        price: 90,
        image: "embroidered-premium-sherpa-blanket-black-front-6a5eed73c1ced.png",
        quantity: 1
      };

      let cart =
        JSON.parse(localStorage.getItem("cart")) || [];

      const existingProduct =
        cart.find(item => item.name === product.name);

      if (existingProduct) {

        existingProduct.quantity += 1;

      } else {

        cart.push(product);

      }

      localStorage.setItem(
        "cart",
        JSON.stringify(cart)
      );

      window.location.href = "cart.html";

    }


    function changeProductImage(imageSource) {

      document.getElementById(
        "mainProductImage"
      ).src = imageSource;

    }

  </script>

</body>

</html>
