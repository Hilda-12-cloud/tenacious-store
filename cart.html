<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Your Cart | @Tenacious</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #0b0b0b;
      color: #ffffff;
      font-family: Arial, sans-serif;
      line-height: 1.6;
    }

    .cart-page {
      max-width: 900px;
      margin: auto;
      padding: 40px 20px;
    }

    .back-link {
      display: inline-block;
      color: #ffffff;
      text-decoration: none;
      margin-bottom: 35px;
      opacity: 0.8;
    }

    .cart-title {
      font-size: 36px;
      margin-bottom: 35px;
    }

    .cart-item {
      display: flex;
      align-items: center;
      gap: 25px;
      padding: 20px 0;
      border-bottom: 1px solid #2d2d2d;
    }

    .cart-item img {
      width: 130px;
      height: 130px;
      object-fit: contain;
      background: #111111;
    }

    .item-info {
      flex: 1;
    }

    .item-info h2 {
      font-size: 20px;
      margin-bottom: 8px;
    }

    .item-price {
      color: #cccccc;
    }

    .quantity {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 12px;
    }

    .quantity button {
      width: 30px;
      height: 30px;
      background: #ffffff;
      color: #000000;
      border: none;
      cursor: pointer;
      font-size: 18px;
    }

    .cart-total {
      text-align: right;
      margin-top: 35px;
      font-size: 24px;
    }

    .checkout-button {
      display: block;
      width: 100%;
      padding: 16px;
      margin-top: 25px;
      background: #ffffff;
      color: #000000;
      text-align: center;
      text-decoration: none;
      font-weight: bold;
      border: none;
      cursor: pointer;
    }

    .empty-cart {
      color: #aaaaaa;
      text-align: center;
      padding: 60px 0;
    }

    @media (max-width: 600px) {
      .cart-item {
        gap: 15px;
      }

      .cart-item img {
        width: 95px;
        height: 95px;
      }

      .cart-title {
        font-size: 30px;
      }
    }
  </style>
</head>

<body>

  <main class="cart-page">

    <a href="index.html#shop" class="back-link">← Continue Shopping</a>

    <h1 class="cart-title">Your Cart</h1>

    <div id="cart-items"></div>

    <div class="cart-total">
      Total: $<span id="cart-total">0.00</span>
    </div>
<a href="checkout.html" class="checkout-button">
  Proceed to Checkout
</a>

  </main>

  <script>
/* =========================================
   @TENACIOUS SHARED CART SYSTEM
========================================= */

function getCart() {

  return JSON.parse(
    localStorage.getItem("tenaciousCart")
  ) || [];

}


/* =========================================
   SAVE CART
========================================= */

function saveCart(cart) {

  localStorage.setItem(
    "tenaciousCart",
    JSON.stringify(cart)
  );

}


/* =========================================
   DISPLAY CART
========================================= */

function displayCart() {

  const cart = getCart();

  const cartItems =
    document.getElementById("cart-items");

  const cartTotal =
    document.getElementById("cart-total");

  cartItems.innerHTML = "";

  if (cart.length === 0) {

    cartItems.innerHTML = `

      <div class="empty-cart">

        Your cart is currently empty.

      </div>

    `;

    cartTotal.textContent = "0.00";

    return;

  }

  let total = 0;

  cart.forEach((item, index) => {

    const price =
      Number(item.price) || 0;

    const quantity =
      Number(item.quantity) || 0;

    total += price * quantity;

    const cartItem =
      document.createElement("div");

    cartItem.className = "cart-item";

    const image =
      document.createElement("img");

    image.src = item.image || "";

    image.alt = item.name || "Product";

    const info =
      document.createElement("div");

    info.className = "item-info";

    const name =
      document.createElement("h2");

    name.textContent =
      item.name || "Product";

    const variant =
      document.createElement("p");

    variant.style.color = "#b9a16a";

    variant.style.fontSize = "13px";

    const variantDetails = [];

    if (item.color) {

      variantDetails.push(
        "Colour: " + item.color
      );

    }

    if (item.size) {

      variantDetails.push(
        "Size: " + item.size
      );

    }

    variant.textContent =
      variantDetails.join(" | ");

    const priceDisplay =
      document.createElement("p");

    priceDisplay.className = "item-price";

    priceDisplay.textContent =
      "$" + price.toFixed(2);

    const quantityControls =
      document.createElement("div");

    quantityControls.className = "quantity";

    const decrease =
      document.createElement("button");

    decrease.textContent = "−";

    decrease.onclick = () =>
      changeQuantity(index, -1);

    const quantityText =
      document.createElement("span");

    quantityText.textContent = quantity;

    const increase =
      document.createElement("button");

    increase.textContent = "+";

    increase.onclick = () =>
      changeQuantity(index, 1);

    const remove =
      document.createElement("button");

    remove.textContent = "Remove";

    remove.style.background = "transparent";

    remove.style.color = "#b9a16a";

    remove.style.border = "none";

    remove.style.cursor = "pointer";

    remove.style.marginTop = "10px";

    remove.onclick = () =>
      removeCartItem(index);

    quantityControls.append(
      decrease,
      quantityText,
      increase
    );

    info.append(
      name,
      variant,
      priceDisplay,
      quantityControls,
      remove
    );

    cartItem.append(
      image,
      info
    );

    cartItems.appendChild(cartItem);

  });

  cartTotal.textContent =
    total.toFixed(2);

}


/* =========================================
   CHANGE QUANTITY
========================================= */

function changeQuantity(index, amount) {

  const cart = getCart();

  if (!cart[index]) return;

  cart[index].quantity += amount;

  if (cart[index].quantity <= 0) {

    cart.splice(index, 1);

  }

  saveCart(cart);

  displayCart();

}


/* =========================================
   REMOVE CART ITEM
========================================= */

function removeCartItem(index) {

  const cart = getCart();

  if (!cart[index]) return;

  cart.splice(index, 1);

  saveCart(cart);

  displayCart();

}


/* =========================================
   INITIALISE CART
========================================= */

displayCart();
    
    </script>
