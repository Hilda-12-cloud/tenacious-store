<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Checkout | @Tenacious</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #0b0b0b;
      color: #ffffff;
      font-family: Arial, sans-serif;
      line-height: 1.6;
    }

    .checkout-page {
      max-width: 1000px;
      margin: auto;
      padding: 40px 20px;
    }

    .back-link {
      display: inline-block;
      color: #ffffff;
      text-decoration: none;
      margin-bottom: 35px;
      opacity: 0.8;
    }

    .checkout-title {
      font-size: 36px;
      margin-bottom: 35px;
    }

    .checkout-container {
      display: grid;
      grid-template-columns: 1.4fr 1fr;
      gap: 50px;
    }

    .section-title {
      font-size: 20px;
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      padding: 14px;
      background: #111111;
      color: #ffffff;
      border: 1px solid #333333;
      outline: none;
    }

    .form-group input:focus,
    .form-group select:focus {
      border-color: #ffffff;
    }

    .order-summary {
      background: #111111;
      border: 1px solid #2d2d2d;
      padding: 25px;
      height: fit-content;
    }

    .summary-item {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      padding: 12px 0;
      border-bottom: 1px solid #2d2d2d;
    }

    .summary-total {
      display: flex;
      justify-content: space-between;
      margin-top: 25px;
      font-size: 22px;
      font-weight: bold;
    }

    .pay-button {
      width: 100%;
      padding: 16px;
      margin-top: 25px;
      background: #ffffff;
      color: #000000;
      border: none;
      cursor: pointer;
      font-weight: bold;
      font-size: 15px;
    }

    .alternative {
      margin-top: 15px;
      text-align: center;
      color: #999999;
      font-size: 13px;
    }

    @media (max-width: 768px) {
      .checkout-container {
        grid-template-columns: 1fr;
        gap: 35px;
      }

      .checkout-title {
        font-size: 30px;
      }
    }
  </style>
</head>

<body>

  <main class="checkout-page">

    <a href="cart.html" class="back-link">← Back to Cart</a>

    <h1 class="checkout-title">Checkout</h1>

    <div class="checkout-container">

      <section>

        <h2 class="section-title">Customer Information</h2>

        <form id="checkout-form">

          <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" required>
          </div>

          <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" required>
          </div>

          <div class="form-group">
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" required>
          </div>

          <div class="form-group">
            <label for="address">Shipping Address</label>
            <input type="text" id="address" required>
          </div>

          <div class="form-group">
            <label for="country">Country</label>

            <select id="country" required>
              <option value="">Select Country</option>
              <option value="Ghana">Ghana</option>
              <option value="United States">United States</option>
              <option value="United Kingdom">United Kingdom</option>
              <option value="Canada">Canada</option>
              <option value="Nigeria">Nigeria</option>
              <option value="Other">Other</option>
            </select>

          </div>

        </form>

      </section>


      <section class="order-summary">

        <h2 class="section-title">Your Order</h2>

        <div id="summary-items"></div>

        <div class="summary-total">
          <span>Total</span>
          <span>$<span id="summary-total">0.00</span></span>
        </div>

        <button class="pay-button" onclick="startPayment()">
          Continue to Payment
        </button>

        <p class="alternative">
          Secure payment options will be available here.
        </p>

      </section>

    </div>

  </main>


  <script>

    function loadOrderSummary() {

      const cart = JSON.parse(localStorage.getItem("cart")) || [];

      const summaryItems = document.getElementById("summary-items");
      const summaryTotal = document.getElementById("summary-total");

      summaryItems.innerHTML = "";

      if (cart.length === 0) {

        summaryItems.innerHTML = "<p>Your cart is empty.</p>";

        summaryTotal.textContent = "0.00";

        return;
      }

      let total = 0;

      cart.forEach(item => {

        total += item.price * item.quantity;

        summaryItems.innerHTML += `
          <div class="summary-item">
            <span>${item.name} × ${item.quantity}</span>
            <span>$${(item.price * item.quantity).toFixed(2)}</span>
          </div>
        `;

      });

      summaryTotal.textContent = total.toFixed(2);
    }


    function startPayment() {

      const form = document.getElementById("checkout-form");

      if (!form.checkValidity()) {
        form.reportValidity();
        return;
      }

      alert("Checkout information received. Paystack will be connected next.");
    }


    loadOrderSummary();

  </script>

</body>

</html>
