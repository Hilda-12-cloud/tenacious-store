<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#080808">
  <meta name="description"
    content="@Tenacious — Resilient by Choice. Premium streetwear, accessories and lifestyle essentials.">

  <title>@Tenacious — Resilient by Choice</title>

  <style>

    /* =========================================================
       RESET
    ========================================================= */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: #080808;
      color: #f5f5f5;
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.6;
      overflow-x: hidden;
    }

    body.modal-open {
      overflow: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }


    /* =========================================================
       SCROLL PROGRESS
    ========================================================= */

    .scroll-progress {
      position: fixed;
      top: 0;
      left: 0;
      width: 0%;
      height: 3px;
      background: #fff;
      z-index: 5000;
      transition: width .08s linear;
    }


    /* =========================================================
       ANNOUNCEMENT BAR
    ========================================================= */

    .announcement {
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 15px;

      background: #fff;
      color: #000;

      font-size: 10px;
      font-weight: bold;
      letter-spacing: 2px;
      text-transform: uppercase;

      text-align: center;
    }

    .announcement span {
      animation: announcementPulse 2.5s ease-in-out infinite;
    }

    @keyframes announcementPulse {
      0%, 100% {
        opacity: .65;
      }

      50% {
        opacity: 1;
      }
    }


    /* =========================================================
       NAVBAR
    ========================================================= */

    .navbar {
      position: sticky;
      top: 0;
      z-index: 2000;

      height: 78px;
      padding: 0 35px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      background: rgba(8, 8, 8, .92);
      border-bottom: 1px solid #252525;

      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .brand {
      font-size: 21px;
      font-weight: bold;
      letter-spacing: 3px;
      white-space: nowrap;
    }

    .brand a {
      transition: opacity .25s ease;
    }

    .brand a:hover {
      opacity: .65;
    }

    .desktop-nav {
      display: flex;
      align-items: center;
      gap: 28px;
    }

    .desktop-nav a {
      position: relative;

      color: #bbb;
      font-size: 11px;
      letter-spacing: 1.5px;
      text-transform: uppercase;

      transition: color .25s ease;
    }

    .desktop-nav a::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -7px;

      width: 0;
      height: 1px;

      background: #fff;
      transition: width .25s ease;
    }

    .desktop-nav a:hover {
      color: #fff;
    }

    .desktop-nav a:hover::after {
      width: 100%;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .header-button {
      position: relative;

      border: 1px solid #3b3b3b;
      background: transparent;
      color: #fff;

      padding: 9px 13px;

      font-size: 10px;
      letter-spacing: 1px;
      text-transform: uppercase;

      transition: .25s ease;
    }

    .header-button:hover {
      background: #fff;
      color: #000;
      border-color: #fff;
    }

    .cart-count {
      position: absolute;
      top: -7px;
      right: -7px;

      min-width: 17px;
      height: 17px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;
      background: #fff;
      color: #000;

      font-size: 9px;
      font-weight: bold;
    }

    .menu-button {
      display: none;

      border: 1px solid #444;
      background: transparent;
      color: #fff;

      width: 42px;
      height: 40px;

      font-size: 19px;
    }


    /* =========================================================
       MOBILE MENU
    ========================================================= */

    .mobile-menu {
      position: fixed;
      top: 112px;
      left: 0;

      width: 100%;
      z-index: 1900;

      background: rgba(10, 10, 10, .98);
      border-bottom: 1px solid #292929;

      padding: 18px 20px;

      transform: translateY(-120%);
      opacity: 0;

      transition:
        transform .35s ease,
        opacity .35s ease;

      pointer-events: none;
    }

    .mobile-menu.active {
      transform: translateY(0);
      opacity: 1;
      pointer-events: auto;
    }

    .mobile-menu a {
      display: block;

      padding: 16px 5px;

      color: #ddd;
      border-bottom: 1px solid #222;

      font-size: 12px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }


    /* =========================================================
       HERO
    ========================================================= */

    .hero {
      position: relative;
      min-height: calc(100vh - 112px);

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      padding: 70px 20px;

      text-align: center;

      overflow: hidden;

      background:
        radial-gradient(
          circle at 50% 42%,
          #292929 0%,
          #151515 28%,
          #0b0b0b 63%,
          #080808 100%
        );
    }

    .hero::before {
      content: "";

      position: absolute;
      inset: 0;

      background:
        linear-gradient(
          115deg,
          transparent 0%,
          rgba(255,255,255,.035) 50%,
          transparent 100%
        );

      transform: translateX(-100%);
      animation: heroSweep 7s ease-in-out infinite;
    }

    @keyframes heroSweep {
      0% {
        transform: translateX(-100%);
      }

      45%, 100% {
        transform: translateX(100%);
      }
    }

    .hero-grid {
      position: absolute;
      inset: 0;

      opacity: .08;

      background-image:
        linear-gradient(#fff 1px, transparent 1px),
        linear-gradient(90deg, #fff 1px, transparent 1px);

      background-size: 80px 80px;

      mask-image: linear-gradient(
        to bottom,
        transparent,
        black 25%,
        black 70%,
        transparent
      );
    }

    .hero-content {
      position: relative;
      z-index: 2;
    }

    .hero-stamp {
      width: 175px;
      height: 175px;

      margin: 0 auto 35px;

      position: relative;

      display: flex;
      align-items: center;
      justify-content: center;

      border: 1px solid #777;
      border-radius: 50%;

      font-size: 24px;
      font-weight: bold;
      letter-spacing: 2px;

      transform: rotate(-8deg);

      box-shadow:
        0 0 0 1px rgba(255,255,255,.02),
        0 0 50px rgba(255,255,255,.06);

      animation: stampFloat 5s ease-in-out infinite;
    }

    .hero-stamp::before {
      content: "";

      position: absolute;
      inset: 9px;

      border: 1px solid #444;
      border-radius: 50%;
    }

    .hero-stamp::after {
      content: "EST. 2026";

      position: absolute;
      bottom: 24px;

      color: #999;

      font-size: 8px;
      letter-spacing: 3px;
    }

    @keyframes stampFloat {
      0%, 100% {
        transform: rotate(-8deg) translateY(0);
      }

      50% {
        transform: rotate(-5deg) translateY(-8px);
      }
    }

    .hero h1 {
      font-size: clamp(48px, 10vw, 115px);
      line-height: .9;

      letter-spacing: clamp(3px, 1vw, 10px);

      font-weight: 800;

      text-shadow:
        0 0 40px rgba(255,255,255,.08);
    }

    .hero-tagline {
      margin-top: 23px;

      color: #bbb;

      font-size: 13px;
      letter-spacing: 6px;
      text-transform: uppercase;
    }

    .hero-text {
      max-width: 620px;

      margin: 25px auto 35px;

      color: #999;

      font-size: 15px;
    }

    .hero-buttons {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .hero-button {
      position: relative;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      padding: 15px 34px;

      background: #fff;
      color: #000;

      font-size: 11px;
      font-weight: bold;
      letter-spacing: 1.5px;
      text-transform: uppercase;

      overflow: hidden;

      transition:
        transform .25s ease,
        background .25s ease;
    }

    .hero-button::before {
      content: "";

      position: absolute;
      inset: 0;

      background: #ddd;

      transform: translateX(-105%);

      transition: transform .35s ease;
    }

    .hero-button span {
      position: relative;
      z-index: 1;
    }

    .hero-button:hover {
      transform: translateY(-3px);
    }

    .hero-button:hover::before {
      transform: translateX(0);
    }

    .hero-button.secondary {
      background: transparent;
      color: #fff;
      border: 1px solid #555;
    }

    .hero-button.secondary::before {
      background: #fff;
    }

    .hero-button.secondary:hover {
      color: #000;
    }

    .scroll-hint {
      position: absolute;
      bottom: 25px;
      left: 50%;

      transform: translateX(-50%);

      color: #666;

      font-size: 9px;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .scroll-hint::after {
      content: "";

      display: block;

      width: 1px;
      height: 35px;

      margin: 8px auto 0;

      background: #555;

      animation: scrollLine 1.8s ease-in-out infinite;
    }

    @keyframes scrollLine {
      0%, 100% {
        transform: scaleY(.4);
        transform-origin: top;
      }

      50% {
        transform: scaleY(1);
        transform-origin: top;
      }
    }


    /* =========================================================
       BRAND STATEMENT
    ========================================================= */

    .statement {
      position: relative;

      padding: 110px 20px;

      text-align: center;

      border-top: 1px solid #222;
      border-bottom: 1px solid #222;

      overflow: hidden;
    }

    .statement::before {
      content: "@";

      position: absolute;
      left: 50%;
      top: 50%;

      transform: translate(-50%, -50%);

      color: rgba(255,255,255,.025);

      font-size: 300px;
      font-weight: bold;
    }

    .statement-content {
      position: relative;
      z-index: 1;
    }

    .statement-small {
      margin-bottom: 20px;

      color: #777;

      font-size: 10px;
      letter-spacing: 4px;
    }

    .statement h2 {
      margin-bottom: 22px;

      font-size: clamp(32px, 6vw, 60px);
      letter-spacing: 1px;
    }

    .statement p:last-child {
      max-width: 650px;
      margin: auto;

      color: #999;
    }


    /* =========================================================
       FEATURE STRIP
    ========================================================= */

    .feature-strip {
      display: grid;
      grid-template-columns: repeat(4, 1fr);

      border-bottom: 1px solid #222;
    }

    .feature {
      padding: 28px 20px;

      text-align: center;

      border-right: 1px solid #222;

      transition: background .3s ease;
    }

    .feature:last-child {
      border-right: 0;
    }

    .feature:hover {
      background: #101010;
    }

    .feature-icon {
      display: block;

      margin-bottom: 7px;

      font-size: 19px;
    }

    .feature strong {
      display: block;

      margin-bottom: 3px;

      font-size: 11px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .feature small {
      color: #777;
      font-size: 10px;
    }


    /* =========================================================
       SHOP
    ========================================================= */

    .shop {
      max-width: 1280px;
      margin: auto;

      padding: 100px 25px;

      scroll-margin-top: 100px;
    }

    .shop-heading {
      margin-bottom: 45px;
      text-align: center;
    }

    .section-label {
      margin-bottom: 13px;

      color: #777;

      font-size: 10px;
      letter-spacing: 4px;
      text-transform: uppercase;
    }

    .shop-heading h2 {
      font-size: clamp(35px, 5vw, 48px);
      letter-spacing: 2px;
    }

    .shop-heading p:last-child {
      margin-top: 10px;

      color: #777;
      font-size: 14px;
    }


    /* =========================================================
       CATEGORY CHIPS
    ========================================================= */

    .category-chips {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;

      margin-bottom: 25px;
    }

    .category-chip {
      border: 1px solid #333;

      background: transparent;
      color: #999;

      padding: 9px 15px;

      font-size: 10px;
      letter-spacing: 1px;
      text-transform: uppercase;

      transition: .25s ease;
    }

    .category-chip:hover,
    .category-chip.active {
      background: #fff;
      color: #000;
      border-color: #fff;
    }


    /* =========================================================
       SHOP CONTROLS
    ========================================================= */

    .shop-controls {
      display: grid;
      grid-template-columns: 1.5fr 1fr 1fr;

      gap: 10px;

      margin-bottom: 20px;
    }

    .shop-controls input,
    .shop-controls select {
      width: 100%;

      padding: 15px;

      border: 1px solid #303030;
      outline: none;

      background: #101010;
      color: #fff;

      font-size: 13px;
    }

    .shop-controls input::placeholder {
      color: #666;
    }

    .shop-controls input:focus,
    .shop-controls select:focus {
      border-color: #777;
    }

    .product-count {
      margin-bottom: 18px;

      color: #666;

      font-size: 11px;
      letter-spacing: 1px;
    }


    /* =========================================================
       PRODUCT GRID
    ========================================================= */

    .product-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);

      gap: 25px;
    }

    .product {
      position: relative;

      background: #101010;
      border: 1px solid #242424;

      padding: 14px;

      transform: translateY(0);

      transition:
        transform .35s cubic-bezier(.2,.8,.2,1),
        border-color .35s ease,
        box-shadow .35s ease;
    }

    .product:hover {
      transform: translateY(-8px);

      border-color: #555;

      box-shadow:
        0 20px 55px rgba(0,0,0,.35);
    }

    .product-image {
      position: relative;

      width: 100%;
      height: 330px;

      margin-bottom: 20px;

      display: flex;
      align-items: center;
      justify-content: center;

      background:
        radial-gradient(
          circle,
          #202020 0%,
          #151515 45%,
          #101010 100%
        );

      overflow: hidden;
    }

    .product-image::after {
      content: "";

      position: absolute;
      inset: 0;

      background:
        linear-gradient(
          110deg,
          transparent 35%,
          rgba(255,255,255,.05) 50%,
          transparent 65%
        );

      transform: translateX(-130%);

      transition: transform .8s ease;
    }

    .product:hover .product-image::after {
      transform: translateX(130%);
    }

    .product-image img {
      width: 100%;
      height: 100%;

      object-fit: contain;

      display: block;

      transition:
        transform .55s cubic-bezier(.2,.8,.2,1),
        opacity .25s ease;
    }

    .product:hover .product-image img {
      transform: scale(1.055);
    }

    .product-badge {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 3;

      padding: 6px 9px;

      background: #fff;
      color: #000;

      font-size: 8px;
      font-weight: bold;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .favorite-button {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 4;

      width: 35px;
      height: 35px;

      display: flex;
      align-items: center;
      justify-content: center;

      border: 1px solid #444;
      border-radius: 50%;

      background: rgba(0,0,0,.65);
      color: #fff;

      font-size: 15px;

      transition: .25s ease;
    }

    .favorite-button:hover,
    .favorite-button.active {
      background: #fff;
      color: #000;
    }

    .product-category {
      margin-bottom: 6px;

      color: #666;

      font-size: 9px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .product h3 {
      min-height: 48px;

      margin-bottom: 8px;

      font-size: 17px;
      line-height: 1.4;
    }

    .product-description {
      min-height: 65px;

      margin-bottom: 13px;

      color: #888;

      font-size: 12px;
      line-height: 1.55;
    }

    .price {
      margin-bottom: 14px;

      color: #fff;

      font-size: 15px;
      font-weight: bold;
    }

    .product-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;

      gap: 7px;
    }

    .view-product,
    .quick-view {
      display: flex;
      align-items: center;
      justify-content: center;

      min-height: 43px;

      border: 1px solid #444;

      font-size: 9px;
      font-weight: bold;
      letter-spacing: 1px;
      text-transform: uppercase;

      transition: .25s ease;
    }

    .view-product {
      background: #fff;
      color: #000;
      border-color: #fff;
    }

    .view-product:hover {
      background: #ccc;
    }

    .quick-view {
      background: transparent;
      color: #fff;
    }

    .quick-view:hover {
      background: #fff;
      color: #000;
    }


    /* =========================================================
       NO RESULTS
    ========================================================= */

    .no-results {
      display: none;

      padding: 80px 20px;

      border: 1px solid #242424;

      text-align: center;
    }

    .no-results h3 {
      margin-bottom: 8px;
    }

    .no-results p {
      color: #777;
    }


    /* =========================================================
       BULK ORDER
    ========================================================= */

    .bulk-section {
      position: relative;

      padding: 90px 25px;

      text-align: center;

      background:
        radial-gradient(
          circle at center,
          #222,
          #101010 55%,
          #090909
        );

      border-top: 1px solid #222;
      border-bottom: 1px solid #222;

      overflow: hidden;
    }

    .bulk-section::before {
      content: "10+";

      position: absolute;

      top: 50%;
      left: 50%;

      transform: translate(-50%, -50%);

      color: rgba(255,255,255,.025);

      font-size: 230px;
      font-weight: 900;

      white-space: nowrap;
    }

    .bulk-content {
      position: relative;
      z-index: 1;
    }

    .bulk-section h2 {
      margin-bottom: 12px;

      font-size: clamp(30px, 5vw, 50px);
    }

    .bulk-section p {
      max-width: 650px;

      margin: auto;

      color: #999;
    }

    .bulk-note {
      display: inline-block;

      margin-top: 22px;

      padding: 8px 12px;

      border: 1px solid #444;

      color: #ddd;

      font-size: 10px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .bulk-button {
      display: inline-flex;

      margin-top: 25px;

      padding: 14px 28px;
