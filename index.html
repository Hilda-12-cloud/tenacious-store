<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>@TENACIOUS | Haute Atelier Ecosystem</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;0,6..96,600;1,6..96,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-primary: #070707;
      --bg-surface: #121212;
      --bg-elevated: #1a1a1a;
      --border-color: #2a2a2a;
      --border-hover: #555555;
      --text-main: #f5f5f5;
      --text-muted: #888888;
      --gold: #c5a059;
      --gold-hover: #e6c584;
      --transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: var(--bg-primary);
      color: var(--text-main);
      font-family: 'Montserrat', sans-serif;
      line-height: 1.7;
      font-weight: 300;
      letter-spacing: 0.03em;
      overflow-x: hidden;
    }

    h1, h2, h3, h4, .brand-font {
      font-family: 'Bodoni Moda', serif;
      letter-spacing: 0.08em;
    }

    /* Top Announcement Bar */
    .top-announcement {
      background: #000;
      color: var(--text-muted);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.3em;
      text-align: center;
      padding: 10px;
      border-bottom: 1px solid var(--border-color);
    }

    /* Header & Navigation */
    header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(7, 7, 7, 0.92);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border-color);
    }

    .nav-container {
      max-width: 1600px;
      margin: 0 auto;
      padding: 22px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Wordmark Stamp Logo Style */
    .brand-stamp {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
    }

    .stamp-box {
      width: 38px;
      height: 38px;
      border: 1px solid var(--gold);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Bodoni Moda', serif;
      font-size: 20px;
      color: var(--gold);
      font-weight: 600;
      transition: var(--transition);
    }

    .brand-stamp:hover .stamp-box {
      background: var(--gold);
      color: #000;
    }

    .logo-text {
      font-family: 'Bodoni Moda', serif;
      font-size: 20px;
      color: var(--text-main);
      letter-spacing: 0.25em;
    }

    .nav-links {
      display: flex;
      gap: 35px;
      list-style: none;
      align-items: center;
    }

    .nav-links a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.25em;
      transition: var(--transition);
    }

    .nav-links a:hover, .nav-links a.active {
      color: var(--text-main);
    }

    .header-actions {
      display: flex;
      gap: 20px;
      align-items: center;
    }

    .action-btn {
      background: none;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 10px 20px;
      cursor: pointer;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      transition: var(--transition);
    }

    .action-btn:hover {
      border-color: var(--gold);
      color: var(--gold);
    }

    /* Hero Carousel / Mock-up Showcase */
    .hero-carousel {
      height: 90vh;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      overflow: hidden;
      background: #000;
      border-bottom: 1px solid var(--border-color);
    }

    .hero-bg-img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.35;
      filter: contrast(1.1);
      transition: opacity 1s ease-in-out;
    }

    .hero-content {
      position: relative;
      z-index: 2;
      max-width: 900px;
      padding: 0 20px;
    }

    .hero-content h1 {
      font-size: clamp(40px, 6vw, 75px);
      margin-bottom: 20px;
      font-weight: 400;
      color: #fff;
    }

    .hero-content p {
      color: var(--text-muted);
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.3em;
      margin-bottom: 35px;
    }

    .btn-gold {
      display: inline-block;
      padding: 16px 45px;
      background: var(--gold);
      color: #000;
      text-decoration: none;
      text-transform: uppercase;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.3em;
      border: none;
      cursor: pointer;
      transition: var(--transition);
    }

    .btn-gold:hover {
      background: var(--gold-hover);
      transform: translateY(-2px);
    }

    /* Atelier Section (Master Ledger with Sort & Filter) */
    .atelier-section {
      max-width: 1600px;
      margin: 0 auto;
      padding: 100px 40px;
    }

    .controls-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 50px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 25px;
      flex-wrap: wrap;
      gap: 25px;
    }

    .filter-tabs {
      display: flex;
      gap: 30px;
      list-style: none;
      flex-wrap: wrap;
    }

    .filter-tab {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.25em;
      transition: var(--transition);
      padding-bottom: 6px;
    }

    .filter-tab.active, .filter-tab:hover {
      color: var(--text-main);
      border-bottom: 1px solid var(--gold);
    }

    .sort-wrapper {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .sort-wrapper label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      color: var(--text-muted);
    }

    .sort-select {
      background: var(--bg-surface);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 10px 15px;
      font-family: 'Montserrat', sans-serif;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      cursor: pointer;
      outline: none;
    }

    .sort-select:focus {
      border-color: var(--gold);
    }

    /* Product Grid */
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 45px 30px;
    }

    .product-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      flex-direction: column;
    }

    .product-card:hover {
      border-color: var(--border-hover);
      transform: translateY(-5px);
    }

    .image-frame {
      width: 100%;
      height: 400px;
      background: #0d0d0d;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    .image-frame img {
      width: 82%;
      height: 82%;
      object-fit: contain;
      transition: var(--transition);
    }

    .product-card:hover .image-frame img {
      transform: scale(1.05);
    }

    .card-info {
      padding: 25px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      flex-grow: 1;
    }

    .product-title {
      font-family: 'Bodoni Moda', serif;
      font-size: 16px;
      margin-bottom: 12px;
      letter-spacing: 0.05em;
    }

    .product-desc {
      color: var(--text-muted);
      font-size: 12px;
      margin-bottom: 20px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid var(--border-color);
      padding-top: 15px;
    }

    .product-price {
      font-family: 'Bodoni Moda', serif;
      font-size: 16px;
      color: var(--gold);
    }

    .explore-link {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.25em;
      color: var(--text-muted);
      transition: var(--transition);
    }

    .product-card:hover .explore-link {
      color: var(--text-main);
    }

    /* Modals & Drawers Styling */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(12px);
      z-index: 2000;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: var(--transition);
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-box {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      width: 90%;
      max-width: 550px;
      padding: 45px;
      position: relative;
      transform: translateY(20px);
      transition: var(--transition);
    }

    .modal-overlay.active .modal-box {
      transform: translateY(0);
    }

    .modal-close {
      position: absolute;
      top: 20px;
      right: 20px;
      background: none;
      border: none;
      color: var(--text-main);
      font-size: 20px;
      cursor: pointer;
    }

    .modal-box h3 {
      font-size: 24px;
      margin-bottom: 20px;
    }

    .modal-box p {
      color: var(--text-muted);
      font-size: 13px;
      margin-bottom: 25px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .form-control {
      width: 100%;
      padding: 14px;
      background: var(--bg-primary);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      font-family: 'Montserrat', sans-serif;
      font-size: 13px;
      outline: none;
    }

    .form-control:focus {
      border-color: var(--gold);
    }

    .checkbox-group {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 25px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .checkbox-group input {
      margin-top: 3px;
      accent-color: var(--gold);
    }

    /* Footer */
    footer {
      background: var(--bg-surface);
      border-top: 1px solid var(--border-color);
      padding: 80px 40px;
      text-align: center;
    }

    .footer-content {
      max-width: 700px;
      margin: 0 auto;
    }

    .footer-links {
      display: flex;
      justify-content: center;
      gap: 30px;
      list-style: none;
      margin: 25px 0;
      flex-wrap: wrap;
    }

    .footer-links a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      transition: var(--transition);
    }

    .footer-links a:hover {
      color: var(--text-main);
    }

    .footer-content p {
      color: var(--text-muted);
      font-size: 12px;
      letter-spacing: 0.1em;
    }

    @media (max-width: 768px) {
      .nav-links { display: none; }
      .controls-bar { flex-direction: column; align-items: flex-start; }
      .atelier-section { padding: 60px 20px; }
    }
  </style>
</head>

<body>

  <div class="top-announcement">www.@Tenacious.com — Maison d'Artisanat & Ecosystem</div>

  <header>
    <div class="nav-container">
      <a href="index.html" class="brand-stamp">
        <div class="stamp-box">T</div>
        <span class="logo-text">@TENACIOUS</span>
      </a>
      
      <ul class="nav-links">
        <li><a href="#atelier" class="active">Atelier</a></li>
        <li><a href="javascript:void(0)" onclick="openModal('aboutModal')">About</a></li>
        <li><a href="javascript:void(0)" onclick="openModal('helpModal')">Need Help</a></li>
        <li><a href="javascript:void(0)" onclick="openModal('policyModal')">Policy</a></li>
      </ul>

      <div class="header-actions">
        <button class="action-btn" onclick="openModal('accountModal')">Account</button>
        <button class="action-btn" onclick="window.location.href='cart.html'">
          Bag (<span id="cartCount">0</span>)
        </button>
      </div>
    </div>
  </header>
