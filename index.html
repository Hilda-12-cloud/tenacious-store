<meta

  <title>@Tenacious — Resilient by Choice</title>  <style>

    /* =========================================================
       RESET
    ========================================================= */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: #080808;
      color: #f5f5f5;
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.6;
      overflow-x: hidden;
    }

    body.menu-open {
      overflow: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input,
    select {
      font-family: inherit;
    }

    button {
      cursor: pointer;
    }


    /* =========================================================
       SCROLL PROGRESS
    ========================================================= */

    .scroll-progress {
      position: fixed;
      top: 0;
      left: 0;
      width: 0%;
      height: 3px;
      background: #fff;
      z-index: 9999;
    }


    /* =========================================================
       PRELOADER
    ========================================================= */

    .preloader {
      position: fixed;
      inset: 0;
      z-index: 10000;

      background: #080808;

      display: flex;
      align-items: center;
      justify-content: center;

      transition:
        opacity 0.7s ease,
        visibility 0.7s ease;
    }

    .preloader.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loader-content {
      text-align: center;
    }

    .loader-logo {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 7px;
      margin-bottom: 22px;

      animation: loaderPulse 1.5s infinite;
    }

    .loader-line {
      width: 180px;
      height: 1px;

      background: #333;

      overflow: hidden;
      margin: auto;
    }

    .loader-line::after {
      content: "";
      display: block;

      width: 45%;
      height: 100%;

      background: #fff;

      animation: loadingLine 1.2s infinite;
    }

    @keyframes loadingLine {
      from {
        transform: translateX(-120%);
      }

      to {
        transform: translateX(330%);
      }
    }

    @keyframes loaderPulse {

      0%,
      100% {
        opacity: 0.45;
      }

      50% {
        opacity: 1;
      }

    }


    /* =========================================================
       HEADER
    ========================================================= */

    .navbar {
      position: sticky;
      top: 0;
      z-index: 2000;

      min-height: 78px;
      padding: 0 35px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      background: rgba(8, 8, 8, 0.88);

      border-bottom: 1px solid #252525;

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .brand {
      font-size: 22px;
      font-weight: 700;

      letter-spacing: 3px;

      white-space: nowrap;
    }

    .brand a {
      transition: opacity 0.3s ease;
    }

    .brand a:hover {
      opacity: 0.65;
    }

    .desktop-nav {
      display: flex;
      align-items: center;
      gap: 30px;
    }

    .desktop-nav a {
      position: relative;

      color: #cfcfcf;

      font-size: 12px;
      letter-spacing: 1.5px;

      text-transform: uppercase;

      transition: color 0.3s ease;
    }

    .desktop-nav a::after {
      content: "";

      position: absolute;

      left: 0;
      bottom: -7px;

      width: 0;
      height: 1px;

      background: #fff;

      transition: width 0.3s ease;
    }

    .desktop-nav a:hover {
      color: #fff;
    }

    .desktop-nav a:hover::after {
      width: 100%;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-button {
      display: inline-flex;

      align-items: center;
      justify-content: center;

      min-width: 72px;

      border: 1px solid #444;

      background: transparent;
      color: #fff;

      padding: 9px 13px;

      font-size: 11px;
      letter-spacing: 1.3px;

      text-transform: uppercase;

      transition:
        background 0.3s ease,
        color 0.3s ease,
        border-color 0.3s ease,
        transform 0.3s ease;
    }

    .header-button:hover {
      background: #fff;
      color: #000;
      border-color: #fff;

      transform: translateY(-2px);
    }

    .menu-button {
      display: none;

      border: 1px solid #444;

      background: transparent;
      color: #fff;

      width: 43px;
      height: 40px;

      font-size: 20px;
    }


    /* =========================================================
       MOBILE MENU
    ========================================================= */

    .mobile-menu {
      position: fixed;

      top: 78px;
      left: 0;

      width: 100%;

      max-height: calc(100vh - 78px);

      overflow-y: auto;

      background: rgba(10, 10, 10, 0.98);

      border-bottom: 1px solid #292929;

      padding: 15px 20px;

      z-index: 1999;

      transform: translateY(-120%);

      opacity: 0;
      pointer-events: none;

      transition:
        transform 0.4s ease,
        opacity 0.4s ease;
    }

    .mobile-menu.active {
      transform: translateY(0);

      opacity: 1;

      pointer-events: auto;
    }

    .mobile-menu a {
      display: block;

      padding: 16px 5px;

      border-bottom: 1px solid #222;

      color: #ddd;

      font-size: 13px;
      letter-spacing: 1px;

      text-transform: uppercase;
    }

    .mobile-menu a:hover {
      color: #fff;
    }


    /* =========================================================
       HERO
    ========================================================= */

    .hero {
      min-height: calc(100vh - 78px);

      display: flex;

      flex-direction: column;

      align-items: center;
      justify-content: center;

      text-align: center;

      position: relative;

      overflow: hidden;

      padding: 80px 20px;

      background:
        radial-gradient(
          circle at 50% 45%,
          #303030 0%,
          #151515 28%,
          #0c0c0c 58%,
          #080808 80%
        );
    }

    .hero::before {
      content: "";

      position: absolute;

      inset: -20%;

      background:
        radial-gradient(
          circle at 20% 30%,
          rgba(255,255,255,0.05),
          transparent 25%
        ),
        radial-gradient(
          circle at 80% 70%,
          rgba(255,255,255,0.04),
          transparent 25%
        );

      animation:
        ambientMove 10s ease-in-out infinite alternate;

      pointer-events: none;
    }

    @keyframes ambientMove {

      from {
        transform:
          scale(1)
          translate(0, 0);
      }

      to {
        transform:
          scale(1.12)
          translate(-2%, 2%);
      }

    }

    .hero-content {
      position: relative;
      z-index: 2;
    }

    .hero-stamp {
      width: 175px;
      height: 175px;

      border: 1px solid #777;

      border-radius: 50%;

      display: flex;

      align-items: center;
      justify-content: center;

      position: relative;

      margin: 0 auto 38px;

      font-size: 25px;

      font-weight: bold;

      letter-spacing: 2px;

      transform: rotate(-8deg);

      animation:
        stampFloat 5s ease-in-out infinite;
    }

    .hero-stamp::before {
      content: "";

      position: absolute;

      inset: 9px;

      border: 1px solid #444;

      border-radius: 50%;
    }

    .hero-stamp::after {
      content: "EST. 2026";

      position: absolute;

      bottom: 25px;

      font-size: 8px;

      letter-spacing: 3px;

      color: #aaa;
    }

    @keyframes stampFloat {

      0%,
      100% {
        transform:
          rotate(-8deg)
          translateY(0);
      }

      50% {
        transform:
          rotate(-5deg)
          translateY(-8px);
      }

    }

    .hero h1 {
      font-size: clamp(48px, 9vw, 110px);

      line-height: 0.95;

      letter-spacing: 8px;

      font-weight: 700;

      background:
        linear-gradient(
          110deg,
          #777,
          #fff,
          #777
        );

      background-size: 200% auto;

      -webkit-background-clip: text;

      background-clip: text;

      color: transparent;

      animation:
        shineText 5s linear infinite;
    }

    @keyframes shineText {

      to {
        background-position:
          200% center;
      }

    }

    .hero-tagline {
      margin-top: 22px;

      font-size: 14px;

      letter-spacing: 6px;

      color: #bbb;

      text-transform: uppercase;
    }

    .hero-text {
      max-width: 620px;

      margin: 25px auto 35px;

      color: #aaa;

      font-size: 16px;
    }

    .hero-button {
      display: inline-flex;

      align-items: center;
      justify-content: center;

      padding: 15px 35px;

      background: #fff;
      color: #000;

      font-size: 12px;

      font-weight: bold;

      letter-spacing: 1.5px;

      text-transform: uppercase;

      transition:
        transform 0.3s ease,
        background 0.3s ease,
        box-shadow 0.3s ease;
    }

    .hero-button:hover {
      background: #ddd;

      transform: translateY(-4px);

      box-shadow:
        0 15px 35px
        rgba(255,255,255,0.12);
    }

    .scroll-hint {
      position: absolute;

      bottom: 28px;

      left: 50%;

      transform:
        translateX(-50%);

      color: #777;

      font-size: 9px;

      letter-spacing: 3px;

      text-transform: uppercase;

      animation:
        scrollHint 2s infinite;
    }

    @keyframes scrollHint {

      0%,
      100% {
        opacity: 0.4;

        transform:
          translate(-50%, 0);
      }

      50% {
        opacity: 1;

        transform:
          translate(-50%, 7px);
      }

    }


    /* =========================================================
       STATEMENT
    ========================================================= */

    .statement {
      padding: 105px 20px;

      text-align: center;

      border-top: 1px solid #222;

      border-bottom: 1px solid #222;

      background:
        linear-gradient(
          180deg,
          #0b0b0b,
          #090909
        );
    }

    .statement-small {
      color: #777;

      font-size: 10px;

      letter-spacing: 5px;

      margin-bottom: 20px;
    }

    .statement h2 {
      font-size:
        clamp(30px, 5vw, 55px);

      letter-spacing: 2px;

      margin-bottom: 20px;
    }

    .statement p:last-child {
      max-width: 680px;

      margin: auto;

      color: #999;

      font-size: 16px;
    }


    /* =========================================================
       MARQUEE
    ========================================================= */

    .marquee {
      overflow: hidden;

      border-bottom: 1px solid #222;

      padding: 15px 0;

      background: #0d0d0d;

      white-space: nowrap;
    }

    .marquee-track {
      display: inline-flex;

      gap: 55px;

      min-width: max-content;

      animation:
        marqueeMove 22s linear infinite;
    }

    .marquee span {
      color: #777;

      font-size: 10px;

      letter-spacing: 4px;

      text-transform: uppercase;
    }

    .marquee strong {
      color: #ddd;
    }

    @keyframes marqueeMove {

      to {
        transform:
          translateX(-50%);
      }

    }


    /* =========================================================
       SHOP
    ========================================================= */

    .shop {
      max-width: 1300px;

      margin: auto;

      padding: 100px 25px;

      scroll-margin-top: 90px;
    }

    .shop-heading {
      text-align: center;

      margin-bottom: 48px;
    }

    .shop-heading .label {
      color: #777;

      font-size: 10px;

      letter-spacing: 5px;

      margin-bottom: 12px;
    }

    .shop-heading h2 {
      font-size:
        clamp(32px, 5vw, 48px);

      letter-spacing: 2px;
    }

    .shop-heading p {
      margin-top: 12px;

      color: #888;
    }


    /* =========================================================
       CONTROLS
    ========================================================= */

    .shop-controls {
      display: grid;

      grid-template-columns:
        1.5fr 1fr 1fr;

      gap: 12px;

      margin-bottom: 30px;
    }

    .shop-controls input,
    .shop-controls select {
      width: 100%;

      padding: 15px;

      background: #111;

      color: #fff;

      border: 1px solid #333;

      outline: none;

      font-size: 13px;

      transition:
        border-color 0.3s ease,
        box-shadow 0.3s ease;
    }

    .shop-controls input:focus,
    .shop-controls select:focus {
      border-color: #777;

      box-shadow:
        0 0 0 3px
        rgba(255,255,255,0.03);
    }

    .product-count {
      color: #777;

      font-size: 12px;

      margin-bottom: 20px;
    }


    /* =========================================================
       PRODUCT GRID
    ========================================================= */

    .product-grid {
      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 28px;
    }

    .product {
      position: relative;

      background: #101010;

      border: 1px solid #242424;

      padding: 16px;

      overflow: hidden;

      opacity: 1;

      transition:
        transform 0.4s
          cubic-bezier(0.16, 1, 0.3, 1),

        border-color 0.3s ease,

        box-shadow 0.4s ease;
    }

    .product::before {
      content: "";

      position: absolute;

      top: 0;
      left: -100%;

      width: 70%;

      height: 1px;

      background: #fff;

      transition:
        left 0.6s ease;
    }

    .product:hover::before {
      left: 130%;
    }

    .product:hover {
      transform:
        translateY(-8px);

      border-color: #4a4a4a;

      box-shadow:
        0 20px 50px
        rgba(0,0,0,0.45);
    }

    .product-image {
      width: 100%;

      background:
        radial-gradient(
          circle,
          #1d1d1d,
          #121212
        );

      overflow: hidden;

      margin-bottom: 20px;

      position: relative;
    }

    .product-image img {
      width: 100%;

      height: 330px;

      object-fit: contain;

      display: block;

      transition:
        transform 0.6s
          cubic-bezier(0.16, 1, 0.3, 1),
        filter 0.6s ease;
    }

    .product:hover
    .product-image img {
      transform:
        scale(1.06);
    }

    .product h3 {
      font-size: 17px;

      margin-bottom: 10px;

      line-height: 1.35;
    }

    .product-description {
      color: #999;

      font-size: 13px;

      min-height: 64px;

      margin-bottom: 15px;
    }

    .price {
      color: #fff;

      font-size: 16px;

      font-weight: bold;

      margin-bottom: 18px;
    }

    .view-product {
      display: flex;

      align-items: center;

      justify-content: center;

      width: 100%;

      padding: 13px;

      background: #fff;

      color: #000;

      font-size: 11px;

      font-weight: bold;

      letter-spacing: 1.5px;

      text-transform: uppercase;

      transition:
        background 0.3s ease,
        transform 0.3s ease;
    }

    .view-product:hover {
      background: #ccc;

      transform:
        translateY(-2px);
    }


    /* =========================================================
       NO RESULTS
    ========================================================= */

    .no-results {
      display: none;

      text-align: center;

      padding: 80px 20px;

      color: #888;

      border: 1px solid #222;

      margin-top: 20px;
    }

    .no-results strong {
      display: block;

      color: #fff;

      font-size: 20px;

      margin-bottom: 10px;
    }


    /* =========================================================
       JOURNAL
    ========================================================= */

    .magazine {
      padding: 120px 25px;

      text-align: center;

      border-top: 1px solid #222;

      scroll-margin-top: 90px;

      background:
        radial-gradient(
          circle at center,
          #141414,
          #090909 65%
        );
    }

    .section-label {
      color: #777;

      font-size: 10px;

      letter-spacing: 5px;

      margin-bottom: 18px;
    }

    .magazine h2,
    .about h2 {
      font-size:
        clamp(35px, 6vw, 65px);

      margin-bottom: 20px;
    }

    .magazine-text,
    .about-text {
      max-width: 680px;

      margin: auto;

      color: #999;

      font-size: 16px;
    }

    .outline-button {
      display: inline-flex;

      margin-top: 30px;

      padding: 14px 30px;

      border: 1px solid #555;

      color: #fff;

      font-size: 11px;

      letter-spacing: 1.5px;

      text-transform: uppercase;

      transition:
        background 0.3s ease,
        color 0.3s ease,
        transform 0.3s ease;
    }

    .outline-button:hover {
      background: #fff;

      color: #000;

      transform:
        translateY(-3px);
    }


    /* =========================================================
       ABOUT
    ========================================================= */

    .about {
      padding: 120px 25px;

      text-align: center;

      border-top: 1px solid #222;

      scroll-margin-top: 90px;
    }

    .about-signature {
      margin-top: 35px;

      font-size: 14px;

      letter-spacing: 6px;

      color: #fff;
    }


    /* =========================================================
       HELP
    ========================================================= */

    .help {
      padding: 90px 25px;

      text-align: center;

      background: #101010;

      border-top: 1px solid #222;

      border-bottom: 1px solid #222;

      scroll-margin-top: 90px;
    }

    .help h2 {
      font-size: 32px;

      margin-bottom: 15px;
    }

    .help p {
      color: #999;

      margin-bottom: 25px;
    }

    .help-links {
      display: flex;

      justify-content: center;

      flex-wrap: wrap;

      gap: 12px;
    }

    .help-links a {
      border: 1px solid #444;

      padding: 12px 22px;

      font-size: 11px;

      letter-spacing: 1px;

      text-transform: uppercase;

      transition:
        background 0.3s ease,
        color 0.3s ease,
        transform 0.3s ease;
    }

    .help-links a:hover {
      background: #fff;

      color: #000;

      transform:
        translateY(-3px);
    }


    /* =========================================================
       POLICIES
    ========================================================= */

    .policies {
      padding: 80px 25px;

      border-top: 1px solid #222;

      text-align: center;

      scroll-margin-top: 90px;
    }

    .policy-grid {
      max-width: 900px;

      margin: 35px auto 0;

      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 15px;
    }

    .policy-card {
      padding: 25px;

      background: #101010;

      border: 1px solid #242424;

      transition:
        transform 0.3s ease,
        border-color 0.3s ease;
    }

    .policy-card:hover {
      transform:
        translateY(-5px);

      border-color: #555;
    }

    .policy-card h3 {
      font-size: 13px;

      letter-spacing: 1px;

      margin-bottom: 10px;
    }

    .policy-card p {
      color: #888;

      font-size: 12px;
    }


    /* =========================================================
       FOOTER
    ========================================================= */

    footer {
      padding: 70px 25
