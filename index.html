<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <meta name="description"
        content="@TENACIOUS — Resilient by Choice. A modern luxury streetwear and lifestyle atelier.">

  <title>@TENACIOUS | Resilient by Choice</title>


  <!-- =========================
       GOOGLE FONTS
  ========================== -->

  <link rel="preconnect"
        href="https://fonts.googleapis.com">

  <link rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">


  <!-- =========================
       CSS
  ========================== -->

  <style>

    /* =========================
       ROOT
    ========================== */

    :root {

      --black: #080808;

      --deep-black: #030303;

      --charcoal: #111111;

      --soft-charcoal: #1b1b1b;

      --gray: #888888;

      --light-gray: #cccccc;

      --white: #f5f3ef;

      --gold: #b79b62;

      --border: rgba(255,255,255,0.12);

      --transition:
        all 0.35s ease;

      --max-width: 1300px;

    }


    /* =========================
       RESET
    ========================== */

    * {

      margin: 0;

      padding: 0;

      box-sizing: border-box;

    }


    html {

      scroll-behavior: smooth;

    }


    body {

      background:
        var(--black);

      color:
        var(--white);

      font-family:
        "Montserrat",
        sans-serif;

      overflow-x: hidden;

      line-height: 1.6;

    }


    body.no-scroll {

      overflow: hidden;

    }


    a {

      color: inherit;

      text-decoration: none;

    }


    button {

      font: inherit;

    }


    img {

      max-width: 100%;

      display: block;

    }


    ::selection {

      background:
        var(--gold);

      color:
        var(--black);

    }


    /* =========================
       SCROLLBAR
    ========================== */

    ::-webkit-scrollbar {

      width: 8px;

    }


    ::-webkit-scrollbar-track {

      background:
        #050505;

    }


    ::-webkit-scrollbar-thumb {

      background:
        #333;

    }


    ::-webkit-scrollbar-thumb:hover {

      background:
        var(--gold);

    }


    /* =========================
       UTILITY
    ========================== */

    .container {

      width: min(
        calc(100% - 40px),
        var(--max-width)
      );

      margin:
        auto;

    }


    .section {

      padding:
        110px 0;

    }


    .section-label {

      display:
        flex;

      align-items:
        center;

      gap:
        12px;

      font-size:
        10px;

      letter-spacing:
        3px;

      text-transform:
        uppercase;

      color:
        var(--gold);

      margin-bottom:
        18px;

    }


    .section-label::before {

      content:
        "";

      width:
        35px;

      height:
        1px;

      background:
        var(--gold);

    }


    .section-title {

      font-family:
        "Cinzel",
        serif;

      font-size:
        clamp(
          32px,
          5vw,
          62px
        );

      font-weight:
        500;

      letter-spacing:
        2px;

      line-height:
        1.15;

      max-width:
        800px;

    }


    .section-text {

      color:
        var(--gray);

      max-width:
        620px;

      margin-top:
        22px;

      font-size:
        14px;

      line-height:
        1.9;

    }


    .gold-text {

      color:
        var(--gold);

    }


    /* =========================
       BUTTONS
    ========================== */

    .btn {

      display:
        inline-flex;

      align-items:
        center;

      justify-content:
        center;

      gap:
        10px;

      padding:
        15px 26px;

      border:
        1px solid transparent;

      cursor:
        pointer;

      font-size:
        11px;

      font-weight:
        600;

      letter-spacing:
        2px;

      text-transform:
        uppercase;

      transition:
        var(--transition);

    }


    .btn-primary {

      background:
        var(--white);

      color:
        var(--black);

    }


    .btn-primary:hover {

      background:
        var(--gold);

      transform:
        translateY(-3px);

    }


    .btn-outline {

      background:
        transparent;

      color:
        var(--white);

      border-color:
        var(--border);

    }


    .btn-outline:hover {

      border-color:
        var(--gold);

      color:
        var(--gold);

      transform:
        translateY(-3px);

    }


    .btn-gold {

      background:
        var(--gold);

      color:
        var(--black);

    }


    .btn-gold:hover {

      filter:
        brightness(1.1);

      transform:
        translateY(-3px);

    }


    /* =========================
       ANNOUNCEMENT BAR
    ========================== */

    .announcement {

      background:
        var(--gold);

      color:
        var(--black);

      text-align:
        center;

      padding:
        9px 20px;

      font-size:
        10px;

      font-weight:
        600;

      letter-spacing:
        1.5px;

      text-transform:
        uppercase;

    }


    /* =========================
       NAVIGATION
    ========================== */

    header {

      position:
        fixed;

      top:
        0;

      left:
        0;

      width:
        100%;

      z-index:
        1000;

      transition:
        var(--transition);

      padding-top:
        35px;

    }


    header.scrolled {

      background:
        rgba(5,5,5,0.96);

      backdrop-filter:
        blur(15px);

      padding-top:
        0;

      border-bottom:
        1px solid var(--border);

    }


    .navbar {

      height:
        82px;

      display:
        flex;

      align-items:
        center;

      justify-content:
        space-between;

      gap:
        30px;

    }


    .nav-left,
    .nav-right {

      display:
        flex;

      align-items:
        center;

      gap:
        25px;

      flex:
        1;

    }


    .nav-right {

      justify-content:
        flex-end;

    }


    .logo {

      position:
        absolute;

      left:
        50%;

      transform:
        translateX(-50%);

      font-family:
        "Cinzel",
        serif;

      font-size:
        24px;

      letter-spacing:
        4px;

      font-weight:
        600;

      white-space:
        nowrap;

    }


    .logo span {

      color:
        var(--gold);

    }


    .nav-link {

      font-size:
        10px;

      letter-spacing:
        1.8px;

      text-transform:
        uppercase;

      color:
        var(--light-gray);

      transition:
        var(--transition);

      position:
        relative;

    }


    .nav-link::after {

      content:
        "";

      position:
        absolute;

      bottom:
        -7px;

      left:
        0;

      width:
        0;

      height:
        1px;

      background:
        var(--gold);

      transition:
        var(--transition);

    }


    .nav-link:hover {

      color:
        var(--white);

    }


    .nav-link:hover::after {

      width:
        100%;

    }


    .icon-btn {

      background:
        none;

      border:
        none;

      color:
        var(--white);

      cursor:
        pointer;

      position:
        relative;

      font-size:
        18px;

      padding:
        5px;

    }


    .cart-count {

      position:
        absolute;

      top:
        -7px;

      right:
        -9px;

      background:
        var(--gold);

      color:
        var(--black);

      width:
        17px;

      height:
        17px;

      border-radius:
        50%;

      display:
        flex;

      align-items:
        center;

      justify-content:
        center;

      font-size:
        8px;

      font-weight:
        700;

    }


    .menu-toggle {

      display:
        none;

      background:
        none;

      border:
        none;

      color:
        white;

      font-size:
        22px;

      cursor:
        pointer;

    }


    /* =========================
       MOBILE MENU
    ========================== */

    .mobile-menu {

      position:
        fixed;

      inset:
        0;

      background:
        rgba(5,5,5,0.99);

      z-index:
        2000;

      display:
        flex;

      flex-direction:
        column;

      align-items:
        center;

      justify-content:
        center;

      gap:
        28px;

      transform:
        translateX(100%);

      transition:
        0.45s ease;

    }


    .mobile-menu.active {

      transform:
        translateX(0);

    }


    .mobile-menu a {

      font-family:
        "Cinzel",
        serif;

      font-size:
        24px;

      letter-spacing:
        3px;

    }


    .close-menu {

      position:
        absolute;

      top:
        30px;

      right:
        30px;

      background:
        none;

      border:
        none;

      color:
        white;

      font-size:
        28px;

      cursor:
        pointer;

    }


    /* =========================
       HERO
    ========================== */

    .hero {

      min-height:
        100vh;

      display:
        flex;

      align-items:
        center;

      position:
        relative;

      overflow:
        hidden;

      background:
        radial-gradient(
          circle at 50% 40%,
          #202020 0%,
          #090909 45%,
          #030303 100%
        );

    }


    .hero::before {

      content:
        "";

      position:
        absolute;

      inset:
        0;

      background:
        linear-gradient(
          90deg,
          rgba(0,0,0,0.7),
          transparent 50%,
          rgba(0,0,0,0.55)
        );

    }


    .hero-grid {

      position:
        relative;

      z-index:
        2;

      display:
        grid;

      grid-template-columns:
        1.1fr 0.9fr;

      gap:
        60px;

      align-items:
        center;

      padding-top:
        100px;

    }


    .hero-eyebrow {

      color:
        var(--gold);

      font-size:
        10px;

      letter-spacing:
        4px;

      text-transform:
        uppercase;

      margin-bottom:
        22px;

    }


    .hero h1 {

      font-family:
        "Cinzel",
        serif;

      font-size:
        clamp(
          55px,
          9vw,
          120px
        );

      font-weight:
        500;

      line-height:
        0.95;

      letter-spacing:
        4px;

    }


    .hero h1 em {

      font-style:
        normal;

      color:
        var(--gold);

    }


    .hero-description {

      max-width:
        520px;

      color:
        var(--light-gray);

      font-size:
        14px;

      line-height:
        1.9;

      margin:
        30px 0;

    }


    .hero-buttons {

      display:
        flex;

      flex-wrap:
        wrap;

      gap:
        15px;

    }


    .hero-art {

      position:
        relative;

      height:
        600px;

      display:
        flex;

      align-items:
        center;

      justify-content:
        center;

    }


    .hero-circle {

      width:
        min(38vw, 480px);

      aspect-ratio:
        1;

      border-radius:
        50%;

      background:
        linear-gradient(
          145deg,
          #292929,
          #0b0b0b
        );

      border:
        1px solid
        rgba(183,155,98,0.3);

      position:
        relative;

      box-shadow:
        0 0 100px
        rgba(183,155,98,0.08);

    }


    .hero-circle::before {

      content:
        "@";

      position:
        absolute;

      top:
        50%;

      left:
        50%;

      transform:
        translate(-50%, -50%);

      font-family:
        "Cinzel",
        serif;

      font-size:
        clamp(
          130px,
          20vw,
          260px
        );

      color:
        rgba(183,155,98,0.18);

    }


    .hero-circle::after {

      content:
        "TENACIOUS";

      position:
        absolute;

      bottom:
        35px;

      left:
        50%;

      transform:
        translateX(-50%);

      font-size:
        10px;

      letter-spacing:
        6px;

      color:
        var(--gold);

    }


    .hero-stamp {

      position:
        absolute;

      right:
        0;

      bottom:
        10px;

      width:
        130px;

      height:
        130px;

      border:
        1px solid
        rgba(255,255,255,0.2);

      border-radius:
        50%;

      display:
        flex;

      align-items:
        center;

      justify-content:
        center;

      text-align:
        center;

      font-size:
        9px;

      line-height:
        1.8;

      letter-spacing:
        2px;

      color:
        var(--gold);

      animation:
        float 5s ease-in-out infinite;

    }


    @keyframes float {

      0%,
      100% {

        transform:
          translateY(0);

      }

      50% {

        transform:
          translateY(-15px);

      }

    }


    .scroll-indicator {

      position:
        absolute;

      bottom:
        35px;

      left:
        50%;

      transform:
        translateX(-50%);

      display:
        flex;

      flex-direction:
        column;

      align-items:
        center;

      gap:
        10px;

      font-size:
        8px;

      letter-spacing:
        3px;

      color:
        var(--gray);

      text-transform:
        uppercase;

    }


    .scroll-line {

      width:
        1px;

      height:
        45px;

      background:
        linear-gradient(
          var(--gold),
          transparent
        );

    }


    /* =========================
       MARQUEE
    ========================== */

    .marquee {

      overflow:
        hidden;

      border-top:
        1px solid var(--border);

      border-bottom:
        1px solid var(--border);

      padding:
        18px 0;

      background:
        var(--deep-black);

    }


    .marquee-track {

      display:
        flex;

      width:
        max-content;

      animation:
        marquee 25s linear infinite;

    }


    .marquee-item {

      font-family:
        "Cinzel",
        serif;

      font-size:
        15px;

      letter-spacing:
        4px;

      white-space:
        nowrap;

      margin-right:
        55px;

      color:
        var(--gray);

    }


    .marquee-item span {

      color:
        var(--gold);

      margin-right:
        55px;

    }


    @keyframes marquee {

      from {

        transform:
          translateX(0);

      }

      to {

        transform:
          translateX(-50%);

      }

    }


    /* =========================
       INTRO
    ========================== */

    .intro-grid {

      display:
        grid;

      grid-template-columns:
        0.8fr 1.2fr;

      gap:
        100px;

      align-items:
        start;

    }


    .intro-number {

      font-family:
        "Cinzel",
        serif;

      font-size:
        clamp(
          90px,
          15vw,
          200px
        );

      color:
        rgba(255,255,255,0.05);

      line-height:
        0.8;

    }


    .intro-content {

      padding-top:
        25px;

    }


    /* =========================
       COLLECTIONS
    ========================== */

    .collections {

      background:
        #0c0c0c;

    }


    .collection-grid {

      display:
        grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap:
        2px;

      margin-top:
        60px;

    }


    .collection-card {

      min-height:
        480px;

      position:
        relative;

      overflow:
        hidden;

      background:
        linear-gradient(
          145deg,
          #252525,
          #0d0d0d
        );

      display:
        flex;

      align-items:
        flex-end;

      padding:
        35px;

      transition:
        var(--transition);

    }


    .collection-card:hover {

      transform:
        translateY(-5px);

    }


    .collection-card::before {

      content:
        "";

      position:
        absolute;

      inset:
        0;

      background:
        radial-gradient(
          circle at center,
          rgba(183,155,98,0.14),
          transparent 60%
        );

      transition:
        var(--transition);

    }


    .collection-card:hover::before {

      transform:
        scale(1.2);

    }


    .collection-content {

      position:
        relative;

      z-index:
        2;

    }


    .collection-number {

      color:
        var(--gold);

      font-size:
        10px;

      letter-spacing:
        3px;

      margin-bottom:
        12px;

    }


    .collection-card h3 {

      font-family:
        "Cinzel",
        serif;

      font-size:
        28px;

      font-weight:
        500;

      letter-spacing:
        2px;

      margin-bottom:
        12px;

    }


    .collection-card p {

      color:
        var(--gray);

      font-size:
        12px;

      margin-bottom:
        22px;

    }


    .collection-link {

      font-size:
        10px;

      letter-spacing:
        2px;

      color:
        var(--gold);

      text-transform:
        uppercase;

    }


    /* =========================
       SHOP
    ========================== */

    .shop-controls {

      display:
        flex;

      align-items:
        center;

      justify-content:
        space-between;

      gap:
        20px;

      margin:
        50px 0 35px;

      flex-wrap:
        wrap;

    }


    .filter-buttons {

      display:
        flex;

      flex-wrap:
        wrap;

      gap:
        10px;

    }


    .filter-btn {

      background:
        transparent;

      border:
        1px solid var(--border);

      color:
        var(--gray);

      padding:
        10px 16px;

      cursor:
        pointer;

      font-size:
        9px;

      letter-spacing:
        1.5px;

      text-transform:
        uppercase;

      transition:
        var(--transition);

    }


    .filter-btn:hover,
    .filter-btn.active {

      border-color:
        var(--gold);

      color:
        var(--gold);

    }


    .search-box {

      position:
        relative;

    }


    .search-box input {

      width:
        220px;

      background:
        #111;

      border:
        1px solid var(--border);

      color:
        white;

      padding:
        11px 15px;

      outline:
        none;

      font-size:
        11px;

    }


    .search-box input:focus {

      border-color:
        var(--gold);

    }


    .product-grid {

      display:
        grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap:
        30px 18px;

    }


    .product-card {

      position:
        relative;

      cursor:
        pointer;

    }


    .product-image {

      height:
        420px;

      position:
        relative;

      overflow:
        hidden;

      background:
        linear-gradient(
          145deg,
          #252525,
          #101010
        );

      display:
        flex;

      align-items:
        center;

      justify-content:
        center;

    }


    .product-image img {

      width:
        100%;

      height:
        100%;

      object-fit:
        cover;

      transition:
        transform 0.6s ease;

    }


    .product-card:hover img {

      transform:
        scale(1.06);

    }


    .product-placeholder {

      font-family:
        "Cinzel",
        serif;

      font-size:
        40px;

      color:
        rgba(183,155,98,0.3);

      letter-spacing:
        3px;

    }


        .product-badge {

      position:
        absolute;

      top:
        15px;

      left:
        15px;

      background:
        var(--black);

      border:
        1px solid var(--border);

      padding:
        7px 10px;

      font-size:
        8px;

      letter-spacing:
        1.5px;

      text-transform:
        uppercase;

      z-index:
        2;

      }


        .quick-view {

      position:
        absolute;

      left:
        50%;

      bottom:
        20px;

      transform:
        translate(-50%, 80px);

      opacity:
        0;

      width:
        calc(100% - 40px);

      transition:
        var(--transition);

    }


    .product-card:hover .quick-view {

      transform:
        translate(-50%, 0);

      opacity:
        1;

    }


    .product-info {

      padding-top:
        16px;

      display:
        flex;

      justify-content:
        space-between;

      gap:
        15px;

    }


    .product-name {

      font-size:
        11px;

      letter-spacing:
        0.8px;

      text-transform:
        uppercase;

      font-weight:
        500;

      line-height:
        1.5;

    }


    .product-category {

      color:
        var(--gray);

      font-size:
        9px;

      text-transform:
        uppercase;

      letter-spacing:
        1.5px;

      margin-top:
        5px;

    }


    .product-price {

      color:
        var(--gold);

      font-size:
        12px;

      white-space:
        nowrap;

    }


    /* =========================
       LOADER
    ========================== */

    .page-loader {

      position:
        fixed;

      inset:
        0;

      background:
        #050505;

      z-index:
        9999;

      display:
        flex;

      align-items:
        center;

      justify-content:
        center;

      transition:
        opacity 0.7s ease,
        visibility 0.7s ease;

    }


    .page-loader.hide {

      opacity:
        0;

      visibility:
        hidden;

    }


    .loader-logo {

      font-family:
        "Cinzel",
        serif;

      font-size:
        28px;

      letter-spacing:
        5px;

      animation:
        pulse 1.5s infinite;

    }


    @keyframes pulse {

      0%,
      100% {

        opacity:
          0.3;

      }

      50% {

        opacity:
          1;

      }

    }
