<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Laptop Sleeve | @Tenacious</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #0b0b0b;
      color: #ffffff;
      font-family: Arial, sans-serif;
      line-height: 1.6;
    }

    .product-page {
      max-width: 1100px;
      margin: auto;
      padding: 40px 20px;
    }

    .back-link {
      display: inline-block;
      color: #ffffff;
      text-decoration: none;
      margin-bottom: 35px;
      font-size: 14px;
      opacity: 0.8;
    }

    .back-link:hover {
      opacity: 1;
    }

    .product-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 60px;
      align-items: center;
    }
.product-gallery {
  width: 100%;
}

.main-product-image {
  background: #111111;
  border: 1px solid #2d2d2d;
  padding: 5px;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 450px;
}

.main-product-image img {
  width: 100%;
  height: 450px;
  object-fit: contain;
  display: block;
}

.product-thumbnails {
  display: flex;
  gap: 12px;
  margin-top: 15px;
  overflow-x: auto;
}

.product-thumbnails img {
  width: 80px;
  height: 80px;
  object-fit: cover;
  background: #111111;
  border: 1px solid #2d2d2d;
  padding: 3px;
  cursor: pointer;
  flex-shrink: 0;
}

.product-thumbnails img:hover {
  border-color: #ffffff;
}

    .product-info h1 {
      font-size: 42px;
      margin-bottom: 20px;
      letter-spacing: 1px;
    }

    .description {
      color: #cfcfcf;
      margin-bottom: 25px;
      font-size: 16px;
    }

    .price {
      font-size: 28px;
      margin-bottom: 30px;
      font-weight: bold;
    }

    .order-button {
      display: block;
      width: 100%;
      padding: 16px;
      background: #ffffff;
      color: #000000;
      text-align: center;
      font-weight: bold;
      border: none;
      cursor: pointer;
      margin-bottom: 15px;
    }

    .whatsapp-button {
      display: block;
      width: 100%;
      padding: 16px;
      border: 1px solid #ffffff;
      color: #ffffff;
      text-align: center;
      text-decoration: none;
      font-weight: bold;
    }

    .details {
      margin-top: 35px;
      border-top: 1px solid #2d2d2d;
      padding-top: 25px;
    }

    .details h2 {
      font-size: 18px;
      margin-bottom: 15px;
    }

    .details p {
      color: #bdbdbd;
      margin-bottom: 8px;
    }

    @media (max-width: 768px) {
      .product-container {
        grid-template-columns: 1fr;
        gap: 35px;
      }

      .product-info h1 {
        font-size: 32px;
      }

      .product-page {
        padding: 25px 15px;
      }
    }
  </style>
</head>

<body>

  <main class="product-page">

    <a href="index.html#shop" class="back-link">← Back to Shop</a>

    <div class="product-container">

      <div class="product-gallery">

  <div class="main-product-image">
    <img
      id="mainProductImage"
      src="laptop-sleeve-13-front-6a4d80010a1f9.png"
      alt="Laptop Sleeve">
  </div>

  <div class="product-thumbnails">

    <img
      src="laptop-sleeve-13-front-6a4d80010a1f9.png"
      alt="Laptop Sleeve front"
      onclick="changeProductImage(this.src)">

    <img
      src="laptop-sleeve-13-product-details-2-6a4d80010a4a7.png"
      alt="Laptop Sleeve details"
      onclick="changeProductImage(this.src)">

    <img
      src="laptop-sleeve-15-front-6a4d80010a52c.png"
      alt="Laptop Sleeve 15 front"
      onclick="changeProductImage(this.src)">

    <img
      src="laptop-sleeve-15-product-details-6a4d80010a574.png"
      alt="Laptop Sleeve details"
      onclick="changeProductImage(this.src)">

  </div>

      </div>

      <div class="product-info">

        <h1>Laptop Sleeve</h1>

        <p class="description">
          Protect your laptop with @Tenacious style — built for those
          who carry their ambition everywhere.
        </p>

        <p class="price">$45.00</p>

        <button class="order-button" onclick="addToCart()">
          Add to Cart
        </button>

        <a href="#" class="whatsapp-button">
          Order via WhatsApp
        </a>

        <div class="details">

          <h2>Product Details</h2>

          <p>• Protective laptop sleeve</p>
          <p>• Lightweight & durable</p>
          <p>• @Tenacious design</p>

        </div>

      </div>

    </div>

  </main>

  <script>

    function addToCart() {

      const product = {
        name: "Laptop Sleeve",
        price: 45,
        image: "laptop-sleeve-13-front-6a4d80010a1f9.png",
        quantity: 1
      };

      let cart = JSON.parse(localStorage.getItem("cart")) || [];

      const existingProduct = cart.find(
        item => item.name === product.name
      );

      if (existingProduct) {
        existingProduct.quantity += 1;
      } else {
        cart.push(product);
      }

      localStorage.setItem("cart", JSON.stringify(cart));

      window.location.href = "cart.html";
    }

  </function changeProductImage(imageSource) {
  document.getElementById("mainProductImage").src = imageSource;
    }>

</body>

  </html>
