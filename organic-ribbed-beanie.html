<script>

  function changeImage(image, button) {

    document.getElementById("mainProductImage").src = image;

    document.querySelectorAll(".thumbnail").forEach(function(item) {
      item.classList.remove("active");
    });

    button.classList.add("active");
  }


  function addToCart() {

    const quantityInput = document.getElementById("quantity");

    let quantity = parseInt(quantityInput.value);

    if (isNaN(quantity) || quantity < 1) {
      quantity = 1;
    }

    const product = {
      name: "Organic Ribbed Beanie",
      price: 39,
      image: "organic-ribbed-beanie-burgundy-left-6a5ee4250f7ad.png",
      quantity: quantity
    };

    let cart = JSON.parse(localStorage.getItem("cart")) || [];

    const existingProduct = cart.find(
      item => item.name === product.name
    );

    if (existingProduct) {

      existingProduct.quantity += quantity;

    } else {

      cart.push(product);

    }

    localStorage.setItem(
      "cart",
      JSON.stringify(cart)
    );

    window.location.href = "cart.html";
  }


  function buyNow() {

    const quantityInput = document.getElementById("quantity");

    let quantity = parseInt(quantityInput.value);

    if (isNaN(quantity) || quantity < 1) {
      quantity = 1;
    }

    const product = {
      name: "Organic Ribbed Beanie",
      price: 39,
      image: "organic-ribbed-beanie-burgundy-left-6a5ee4250f7ad.png",
      quantity: quantity
    };

    let cart = JSON.parse(localStorage.getItem("cart")) || [];

    const existingProduct = cart.find(
      item => item.name === product.name
    );

    if (existingProduct) {

      existingProduct.quantity += quantity;

    } else {

      cart.push(product);

    }

    localStorage.setItem(
      "cart",
      JSON.stringify(cart)
    );

    window.location.href = "checkout.html";
  }

</script>
