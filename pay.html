<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout — Tenacious Store</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 420px; margin: 3rem auto; padding: 0 1rem; }
    label { display: block; margin: 1rem 0 0.25rem; font-weight: 600; }
    input { width: 100%; padding: 0.6rem; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem; }
    button { width: 100%; margin-top: 1.5rem; padding: 0.75rem; background: #0b7a3b; color: #fff;
             border: none; border-radius: 6px; font-size: 1rem; cursor: pointer; }
    button:disabled { opacity: 0.6; }
    #status { margin-top: 1rem; font-size: 0.9rem; color: #555; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Checkout</h1>
  <form id="checkout-form">
    <label for="email">Email</label>
    <input type="email" id="email" required placeholder="customer@example.com" />
    <label for="amount">Amount (NGN)</label>
    <input type="number" id="amount" required min="1" step="0.01" placeholder="5000" />
    <button type="submit" id="pay-btn">Pay with Paystack</button>
  </form>
  <div id="status"></div>
  <script src="https://js.paystack.co/v1/inline.js"></script>
  <script>
    const BACKEND_URL = 'https://tenacious-payments.hildaocran3.workers.dev';
    document.getElementById('checkout-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const amount = parseFloat(document.getElementById('amount').value);
      const statusEl = document.getElementById('status');
      const btn = document.getElementById('pay-btn');
      if (!email || !amount || amount <= 0) {
        statusEl.textContent = 'Please enter a valid email and amount.';
        return;
      }
      btn.disabled = true;
      statusEl.textContent = 'Creating transaction…';
      try {
        const res = await fetch(BACKEND_URL + '/initialize', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, amount, currency: 'NGN', metadata: { cart: 'tenacious-store' } }),
        });
        const body = await res.json();
        if (!res.ok || !body.status) throw new Error(body.error || body.message || 'Failed to initialize payment');
        const handler = PaystackPop.setup({
          access_code: body.data.access_code,
          onClose: () => { statusEl.textContent = 'Payment window closed. No charge was made.'; btn.disabled = false; },
          callback: (response) => { statusEl.textContent = 'Payment reference: ' + response.reference + '. Verifying…'; verifyPayment(response.reference); },
        });
        handler.openIframe();
      } catch (err) {
        statusEl.textContent = 'Error: ' + err.message;
        btn.disabled = false;
      }
    });
    async function verifyPayment(reference) {
      try {
        const res = await fetch(BACKEND_URL + '/verify/' + encodeURIComponent(reference));
        const body = await res.json();
        const txn = body.data;
        if (txn && txn.status === 'success') {
          document.getElementById('status').textContent = '✅ Payment successful! Reference: ' + txn.reference + '. Amount: ' + (txn.amount / 100).toFixed(2) + ' ' + txn.currency + '.';
        } else {
          document.getElementById('status').textContent = 'Payment status: ' + (txn ? txn.status : 'unknown') + '. Reference: ' + reference;
        }
      } catch (err) {
        document.getElementById('status').textContent = 'Verification error: ' + err.message;
      }
      document.getElementById('pay-btn').disabled = false;
    }
  </script>
</body>
</html>
