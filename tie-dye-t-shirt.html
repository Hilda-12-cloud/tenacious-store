<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Unisex Oversized Tie-Dye T-Shirt | @Tenacious</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #0b0b0b;
      color: #ffffff;
      font-family: Arial, sans-serif;
      line-height: 1.6;
    }

    .product-page {
      max-width: 1100px;
      margin: auto;
      padding: 40px 20px;
    }

    .back-link {
      display: inline-block;
      color: #ffffff;
      text-decoration: none;
      margin-bottom: 35px;
      font-size: 14px;
      opacity: 0.8;
    }

    .back-link:hover {
      opacity: 1;
    }

    .product-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 60px;
      align-items: center;
    }

    .product-gallery {
      width: 100%;
    }

    .main-product-image {
      background: #111111;
      border: 1px solid #2d2d2d;
      padding: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 450px;
    }

    .main-product-image img {
      width: 100%;
      height: 450px;
      object-fit: contain;
      display: block;
    }

    .product-thumbnails {
      display: flex;
      gap: 12px;
      margin-top: 15px;
      overflow-x: auto;
    }

    .product-thumbnails img {
      width: 80px;
      height: 80px;
      object-fit: cover;
      background: #111111;
      border: 1px solid #2d2d2d;
      padding: 3px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .product-thumbnails img:hover {
      border-color: #ffffff;
    }

    .product-info h1 {
      font-size: 42px;
      margin-bottom: 20px;
      letter-spacing: 1px;
    }

    .description {
      color: #cfcfcf;
      margin-bottom: 25px;
      font-size: 16px;
    }

    .price {
      font-size: 28px;
      margin-bottom: 30px;
      font-weight: bold;
    }

    .order-button {
      display: block;
      width: 100%;
      padding: 16px;
      background: #ffffff;
      color: #000000;
      text-align: center;
      font-weight: bold;
      border: none;
      cursor: pointer;
      margin-bottom: 15px;
    }

    .whatsapp-button {
      display: block;
      width: 100%;
      padding: 16px;
      border: 1px solid #ffffff;
      color: #ffffff;
      text-align: center;
      text-decoration: none;
      font-weight: bold;
    }

    .details {
      margin-top: 35px;
      border-top: 1px solid #2d2d2d;
      padding-top: 25px;
    }

    .details h2 {
      font-size: 18px;
      margin-bottom: 15px;
    }

    .details p {
      color: #bdbdbd;
      margin-bottom: 8px;
    }

    @media (max-width: 768px) {

      .product-container {
        grid-template-columns: 1fr;
        gap: 35px;
      }

      .product-info h1 {
        font-size: 32px;
      }

      .product-page {
        padding: 25px 15px;
      }
    }
  </style>
</head>

<body>

  <main class="product-page">

    <a href="index.html#shop" class="back-link">
      ← Back to Shop
    </a>

    <div class="product-container">

      <!-- PRODUCT GALLERY -->

      <div class="product-gallery">

        <div class="main-product-image">

          <img
            id="mainProductImage"
            src="unisex-oversized-tie-dye-t-shirt-milky-way-front-6a5060f41d078.png"
            alt="Unisex Oversized Tie-Dye T-Shirt">

        </div>


        <div class="product-thumbnails">

          <img
            src="unisex-oversized-tie-dye-t-shirt-milky-way-front-6a5060f41d078.png"
            alt="Milky Way front"
            onclick="changeProductImage(this.src)">

          <img
            src="unisex-oversized-tie-dye-t-shirt-navy-white-back-6a5060f41e530.png"
            alt="Navy white back"
            onclick="changeProductImage(this.src)">

          <img
            src="unisex-oversized-tie-dye-t-shirt-sherbet-rainbow-product-details-6a5060f4207ce.png"
            alt="Sherbet Rainbow product details"
            onclick="changeProductImage(this.src)">

          <img
            src="unisex-oversized-tie-dye-t-shirt-black-white-front-6a5060f427513.png"
            alt="Black white front"
            onclick="changeProductImage(this.src)">

          <img
            src="unisex-oversized-tie-dye-t-shirt-classic-rainbow-zoomed-in-6a5060f424bed.png"
            alt="Classic Rainbow detail"
            onclick="changeProductImage(this.src)">

        </div>

      </div>


      <!-- PRODUCT INFORMATION -->

      <div class="product-info">

        <h1>Unisex Oversized Tie-Dye T-Shirt</h1>

        <p class="description">
          An expressive oversized layer made for individuality,
          confidence, and the @Tenacious spirit.
        </p>

        <p class="price">$75.00</p>


        <button class="order-button" onclick="addToCart()">
          Add to Cart
        </button>


        <a href="#" class="whatsapp-button">
          Order via WhatsApp
        </a>


        <div class="details">

          <h2>Product Details</h2>

          <p>• Oversized unisex fit</p>
          <p>• Soft, comfortable fabric</p>
          <p>• Bold tie-dye finish</p>
          <p>• Designed for everyday expression</p>

        </div>

      </div>

    </div>

  </main>


  <script>

    function addToCart() {

      const product = {
        name: "Unisex Oversized Tie-Dye T-Shirt",
        price: 75,
        image: "unisex-oversized-tie-dye-t-shirt-milky-way-front-6a5060f41d078.png",
        quantity: 1
      };

      let cart =
        JSON.parse(localStorage.getItem("cart")) || [];

      const existingProduct =
        cart.find(item => item.name === product.name);

      if (existingProduct) {

        existingProduct.quantity += 1;

      } else {

        cart.push(product);

      }

      localStorage.setItem(
        "cart",
        JSON.stringify(cart)
      );

      window.location.href = "cart.html";

    }


    function changeProductImage(imageSource) {

      document.getElementById(
        "mainProductImage"
      ).src = imageSource;

    }

  </script>

</body>

</html>
